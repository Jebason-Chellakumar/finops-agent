name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,aws]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (scripted Claude client, no API key needed)
        run: pytest -v
      - name: Deterministic report smoke test
        run: finops report
